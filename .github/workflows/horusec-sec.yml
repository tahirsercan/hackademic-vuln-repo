name: HorusecSecurityPipeline

on:
  push:
    branches: [ "main", "develop", "next" ]
  pull_request:
    branches: [ "main", "develop", "next" ]

jobs:
  horusec-security:
    name: Run Horusec Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Code Scanning için
      contents: read         # Checkout için gerekli
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Horusec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest

    - name: Run Horusec Scan (JSON + SARIF)
      id: scan
      run: |
        horusec start -p="./" \
          --enable-php="true" \
          --enable-dart="false" \
          --enable-csharp="false" \
          --output-file="horusec_report" \
          --report-type="json,sarif" \
          --severity="HIGH,CRITICAL" \
          --confidence="HIGH" \
          --false-positive="true" \
          --ignore="**/vendor/**"  # Vendor dizinini ignore et

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: horusec_report.sarif
      if: always()

    - name: Upload Reports as Artifact
      uses: actions/upload-artifact@v4  # Güncel versiyon
      with:
        name: horusec-security-reports
        path: |
          horusec_report.json
          horusec_report.sarif
      if: always()

    - name: Check for Critical Findings
      if: steps.scan.outcome == 'failure'
      run: |
        echo "🛑 Kritik güvenlik açıkları tespit edildi!"
        echo "Lütfen horusec_report.json dosyasını inceleyin"
        exit 1
