name: HorusecSecurityPipeline

on:
  push:
    branches: [ "main", "develop", "next" ]
  pull_request:
    branches: [ "main", "develop", "next" ]

jobs:
  horusec-security:
    name: Run Horusec Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Horusec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest

    - name: Run Horusec Scan
      id: scan
      # The '--tools' flag has been removed as it's no longer supported by Horusec.
      # Horusec will now automatically detect the technologies in your project.
      run: |
        horusec start -p="./" \
          --output-format="json,sarif" \
          --json-output-file="horusec_report" \
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false

    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: horusec_report.sarif
      if: always() # Ensures this step runs even if the scan had an error

    - name: Upload Reports as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: horusec-security-reports
        path: |
          horusec_report.json
          horusec_report.sarif
      if: always() # Ensures this step runs even if the scan had an error
