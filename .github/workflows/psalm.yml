name: Psalm Security Scan

on:
  push:
    branches: [ "next" ]
  pull_request:
    branches: [ "next" ]
  schedule:
    - cron: '20 1 * * 4'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Download Psalm
        run: |
          curl -L https://github.com/vimeo/psalm/releases/latest/download/psalm.phar -o psalm.phar
          chmod +x psalm.phar

      - name: Init Psalm config if not present
        run: |
          if [ ! -f psalm.xml ]; then
            php psalm.phar --init --level=6 --source=.
          fi

      - name: Run Psalm scan
        run: |
          php psalm.phar --output-format=sarif > results.sarif
          php psalm.phar --output-format=json > results.json

      - name: Upload SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
