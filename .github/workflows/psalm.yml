name: Psalm Security Scan (with SARIF upload)

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next
  schedule:
    - cron: '16 22 * * 1'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: composer install --no-progress --no-suggest

      - name: Run Psalm and generate SARIF and JSON outputs
        run: |
          ./vendor/bin/psalm --output-format=sarif > results.sarif
          ./vendor/bin/psalm --output-format=json > results.json

      - name: Upload SARIF results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Upload JSON results as artifact
        uses: actions/upload-artifact@v3
        with:
          name: psalm-json-results
          path: results.json
