name: Psalm Security Scan (Custom JSON Upload)

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next
  schedule:
    - cron: '16 22 * * 1'

permissions:
  contents: read # For actions/checkout to fetch the code
  # security-events: write # Not strictly needed if not uploading SARIF to Code Scanning

jobs:
  php-security:
    name: Psalm – Static Analysis for PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Psalm Static Analysis (Output JSON)
        uses: psalm/psalm-github-actions@2.3.0
        with:
          security_analysis: true
          show_info: false
          composer_require_dev: true
          # Change report_file to .json. NOTE: This might not be a standard JSON format,
          # but rather Psalm's internal JSON representation.
          report_file: results.json
          # composer_ignore_platform_reqs: true

      - name: Upload Custom JSON Report as Artifact
        uses: actions/upload-artifact@v4 # Use upload-artifact for general files
        with:
          name: psalm-json-report
          path: results.json # Path to your generated JSON file
          # retention-days: 5 # Optional: how long to keep the artifact
