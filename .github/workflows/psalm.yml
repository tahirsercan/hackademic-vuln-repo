name: Psalm Security Scan

on:
  push:
    branches: [ "next" ]
  pull_request:
    branches: [ "next" ]
  schedule:
    - cron: '38 15 * * 6'

permissions:
  contents: read

jobs:
  psalm-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies if composer.json exists
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress
          fi

      - name: Download Psalm
        run: |
          curl -L https://github.com/vimeo/psalm/releases/latest/download/psalm.phar -o psalm.phar
          chmod +x psalm.phar
          php psalm.phar --init --level=1 || true

      - name: Install security plugin
        run: |
          if [ -f composer.json ]; then
            composer require --dev psalm/plugin-security
            vendor/bin/psalm-plugin enable psalm/plugin-security
          else
            echo '<plugins><pluginClass class="Psalm\\Plugin\\SecurityPlugin" /></plugins>' > .psalm.xml
          fi

      - name: Run Psalm with SARIF output
        run: php psalm.phar --output-format=sarif > results.sarif

      - name: Upload Security Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
