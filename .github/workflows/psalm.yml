name: Psalm Security Scan (SARIF & JSON Reports)

on:
  push:
    branches:
      - next
  pull_request:
    branches:
      - next
  schedule:
    - cron: '16 22 * * 1' # Runs every Monday at 22:16 UTC

permissions:
  contents: read # For actions/checkout to fetch the code
  security-events: write # REQUIRED for github/codeql-action/upload-sarif for SARIF uploads

jobs:
  php-security:
    name: Psalm – Static Analysis for PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Specify your PHP version (e.g., '8.2', '8.3')
          extensions: mbstring, dom, xml, pdo, pdo_mysql # Add necessary PHP extensions for your project
          coverage: none # Not needed for Psalm security scan
          tools: composer:v2 # Ensure Composer is available

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # --- Run Psalm twice: once for SARIF, once for JSON ---
      - name: Run Psalm Static Analysis (Generate SARIF)
        uses: psalm/psalm-github-actions@2.3.0
        with:
          security_analysis: true
          show_info: false
          composer_require_dev: true
          report_file: results.sarif # Outputting SARIF format for GitHub Code Scanning
          # composer_ignore_platform_reqs: true

      - name: Run Psalm Static Analysis (Generate JSON)
        # Note: We run Psalm again specifically for the JSON output.
        # This ensures the SARIF output isn't overwritten.
        uses: psalm/psalm-github-actions@2.3.0
        with:
          security_analysis: true
          show_info: false
          composer_require_dev: true
          report_file: results.json # Outputting JSON format for artifact upload
          # composer_ignore_platform_reqs: true

      # --- Upload Reports ---
      - name: Upload SARIF results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3 # Using the SARIF upload action
        with:
          sarif_file: results.sarif # Must match the report_file from the SARIF Psalm step

      - name: Upload Custom JSON Report as Artifact
        uses: actions/upload-artifact@v4 # Using upload-artifact for general files
        with:
          name: psalm-json-report # Name your artifact
          path: results.json # Path to your generated JSON file
          # retention-days: 5 # Optional: how many days to retain this artifact
