name: PHP Code Analysis with Exakat

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

jobs:
  exakat_analysis:
    runs-on: ubuntu-latest # This is an AMD64 runner by default

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Adjust to your project's PHP version

      - name: Run Exakat Analysis
        id: exakat
        run: |
          # --- IMPORTANT CHANGE HERE ---
          # Specify --platform linux/amd64 to ensure the correct image architecture is pulled
          docker run --rm --platform linux/amd64 -v "$(pwd):/app" exakat/exakat:latest analyze -p /app --json -o /app/exakat_report.json

          if [ -f exakat_report.json ]; then
            REPORT_SIZE=$(stat -c%s exakat_report.json)
            if [ "$REPORT_SIZE" -lt 100 ]; then # Adjust this threshold if your minimal valid report is larger
              echo "Exakat raporu çok küçük, analizde sorun olabilir!"
              exit 1
            fi
            echo "Exakat analizi başarıyla tamamlandı. Rapor boyutu: $REPORT_SIZE byte."
          else
            echo "Exakat raporu bulunamadı!"
            exit 1
          fi

      - name: Upload Exakat Report
        uses: actions/upload-artifact@v4
        with:
          name: exakat-report
          path: exakat_report.json
          if-no-files-found: ignore

      - name: Generate HTML Report and Upload (Optional)
        run: |
          # --- IMPORTANT CHANGE HERE ---
          # Also specify --platform linux/amd64 for the export command
          docker run --rm --platform linux/amd64 -v "$(pwd):/app" exakat/exakat:latest export -p /app --html /app/exakat_report.html
        if: always() # Attempt to generate report even if analysis failed

      - name: Upload HTML Report (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: exakat-html-report
          path: exakat_report.html
          if-no-files-found: ignore
