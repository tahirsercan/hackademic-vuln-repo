name: PHP Code Analysis with Exakat

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

jobs:
  exakat_analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug: List /app directory contents # This step's name
        run: | # This 'run:' should be indented exactly 8 spaces relative to the start of the line for 'name:'
          echo "Listing contents of /app:"
          ls -RF /app
          echo "End of /app listing."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Projenizin PHP sürümünü buraya yazın

      - name: Run Exakat Analysis
        id: exakat
        run: |
          PHP_CODE_PATHS="-p /app/controller -p /app/model/common -p /app/pages -p /app/view -p /app/admin -p /app"

          docker run --rm --platform linux/amd64 --pull always -v "$(pwd):/app" exakat/exakat-ga:latest analyze ${PHP_CODE_PATHS} --json -o /app/exakat_report.json

          if [ -f exakat_report.json ]; then
            REPORT_SIZE=$(stat -c%s exakat_report.json)
            if [ "$REPORT_SIZE" -lt 100 ]; then
              echo "Exakat raporu çok küçük, analizde sorun olabilir!"
              exit 1
            fi
            echo "Exakat analizi başarıyla tamamlandı. Rapor boyutu: $REPORT_SIZE byte."
          else
            echo "Exakat raporu bulunamadı!"
            exit 1
          fi

      - name: Upload Exakat Report
        uses: actions/upload-artifact@v4
        with:
          name: exakat-report
          path: exakat_report.json
          if-no-files-found: ignore

      - name: Generate HTML Report and Upload (Optional)
        run: |
          docker run --rm --platform linux/amd64 --pull always -v "$(pwd):/app" exakat/exakat-ga:latest export ${PHP_CODE_PATHS} --html /app/exakat_report.html
        if: always()

      - name: Upload HTML Report (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: exakat-html-report
          path: exakat_report.html
          if-no-files-found: ignore
